<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>APP-GAP — Module</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<style>body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50">

<header class="sticky top-0 z-10 border-b border-zinc-200 bg-white/80 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-3">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 shadow-sm">
        <span class="text-base font-bold text-white">G</span>
      </a>
      <div>
        <p id="modTitle" class="text-sm font-semibold text-zinc-900">—</p>
        <p id="modSub" class="text-xs text-zinc-500">—</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a id="cfgLink" href="#" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50">Configurer</a>
      <a href="dashboard.html" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50">Retour</a>
    </div>
  </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-6">
  <div id="content"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app-data.js"></script>
<script>
try { if (sessionStorage.getItem("session") !== "admin") window.location.href = "login.html"; } catch {}

const params = new URLSearchParams(location.search);
const moduleId = params.get("id");
const mod = MODULES.find((m) => m.id === moduleId);
let schema = { tables: {}, relations: [], moduleConfigs: {} };

document.getElementById("cfgLink").href = `admin.html#modules`;

(async () => {
  schema = await loadSchema();
  if (!mod) {
    document.getElementById("content").innerHTML = `<p class="text-sm text-zinc-500">Module introuvable.</p>`;
    return;
  }
  document.getElementById("modTitle").textContent = mod.label;
  const cfg = schema.moduleConfigs[mod.id];
  const table = cfg?.tableId ? schema.tables[cfg.tableId] : null;
  const _u = getCurrentUnit();
  document.getElementById("modSub").textContent = (table ? `Source : ${table.name}` : "Non configuré") + (_u ? ` · Unité ${_u}` : "");

  const content = document.getElementById("content");
  if (!cfg || !cfg.tableId || !table) {
    content.innerHTML = `
      <div class="rounded-2xl border border-dashed border-zinc-300 bg-white p-10 text-center">
        <p class="text-sm text-zinc-600">Aucune table n'est associée à ce module.</p>
        <a href="admin.html#modules" class="mt-3 inline-block rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 px-4 py-2 text-sm font-medium text-white">Configurer le module</a>
      </div>`;
  } else if ((cfg.layout || (mod.id === "inspecteur" ? "form" : "table")) === "form") {
    renderFormLanding(table, cfg);
  } else {
    renderTable(table, cfg);
  }
})();

function renderFormLanding(table, cfg) {
  const selectorDefs = (cfg.selectors || []).map((s) => ({ ...s, col: table.columns.find((c) => c.id === s.column) })).filter((s) => s.col);

  function computeOptions(selDef, currentValues) {
    const others = selectorDefs.filter((o) => o.id !== selDef.id);
    const baseRows = applyFilters(table.rows, cfg.filters, table.columns);
    const scoped = baseRows.filter((r) => others.every((o) => {
      const want = currentValues[o.id];
      return want === undefined || want === "" || String(r[o.col.id] ?? "") === String(want);
    }));
    const map = new Map();
    for (const r of scoped) {
      const v = r[selDef.col.id];
      if (v === undefined || v === null || v === "") continue;
      const k = String(v);
      map.set(k, (map.get(k) || 0) + 1);
    }
    return { distinct: [...map.entries()].sort((a,b) => a[0].localeCompare(b[0], "fr", { numeric: true })), totalCount: scoped.length };
  }

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="grid gap-6 lg:grid-cols-2">
      <section class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm">
        <div class="mb-5 rounded-lg border border-indigo-200 bg-indigo-50 px-4 py-2 text-center">
          <h2 class="text-base font-semibold text-indigo-900">${escapeHtml(mod.label)}</h2>
        </div>
        <div id="selectorsForm" class="space-y-3"></div>
        <div class="mt-6 flex justify-center">
          <button id="openTableBtn" class="rounded-xl border-2 border-indigo-200 bg-white px-6 py-3 text-sm font-semibold text-indigo-900 shadow-sm transition hover:bg-indigo-50">
            Saisie des contrôles à réaliser
          </button>
        </div>
      </section>

      <section class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm">
        <div class="mb-5 rounded-lg border border-indigo-200 bg-indigo-50 px-4 py-2 text-center">
          <h2 class="text-base font-semibold text-indigo-900">Ajouter un point de vigilance</h2>
        </div>
        <div class="flex justify-center pt-8">
          <button id="addPointBtn" class="rounded-xl border-2 border-indigo-200 bg-white px-6 py-3 text-sm font-semibold text-indigo-900 shadow-sm transition hover:bg-indigo-50">
            Ajouter un point inexistant<br/>dans la base
          </button>
        </div>
      </section>
    </div>
  `;

  function paintSelectors() {
    const c = document.getElementById("selectorsForm");
    if (selectorDefs.length === 0) {
      c.innerHTML = `<p class="text-sm text-zinc-500">Aucun sélecteur configuré. <a class="font-medium text-indigo-600 hover:underline" href="admin.html#modules">Configurer</a></p>`;
      return;
    }
    c.innerHTML = selectorDefs.map((s) => {
      const opts = computeOptions(s, selectorValues);
      return `<label class="block">
        <span class="mb-1 block text-sm font-medium text-zinc-700">${escapeHtml(s.col.name)} :</span>
        <select data-selid="${s.id}" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm">
          <option value="">Tous (${opts.totalCount})</option>
          ${opts.distinct.map(([v, count]) => `<option value="${escapeAttr(v)}" ${selectorValues[s.id]===v?'selected':''}>${escapeHtml(v)} (${count})</option>`).join("")}
        </select>
      </label>`;
    }).join("");
    c.querySelectorAll("[data-selid]").forEach((el) => el.addEventListener("change", () => {
      const v = el.value;
      if (v === "") delete selectorValues[el.dataset.selid];
      else selectorValues[el.dataset.selid] = v;
      paintSelectors();
    }));
  }
  paintSelectors();

  document.getElementById("openTableBtn").addEventListener("click", () => {
    renderTable(table, cfg);
  });
  document.getElementById("addPointBtn").addEventListener("click", () => {
    openNewRowModal(table);
  });
}

function openNewRowModal(table) {
  const wrap = document.createElement("div");
  wrap.className = "fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4";
  wrap.innerHTML = `
    <div class="w-full max-w-2xl rounded-2xl bg-white p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-base font-semibold text-zinc-900">Nouvelle ligne — ${escapeHtml(table.name)}</h3>
        <button id="closeModalBtn" class="text-zinc-400 hover:text-zinc-700">✕</button>
      </div>
      <div class="grid gap-3 sm:grid-cols-2">
        ${table.columns.map((c) => `
          <div>
            <label class="mb-1 block text-xs font-medium text-zinc-600">${escapeHtml(c.name)} <span class="text-zinc-400">${c.type}</span></label>
            ${c.type === "liste"
              ? `<select data-col="${c.id}" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm"><option value="">—</option>${(c.options||[]).map((o) => `<option>${escapeHtml(o)}</option>`).join("")}</select>`
              : `<input data-col="${c.id}" type="${c.type==='nombre'?'number':c.type==='date'?'date':'text'}" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm" />`}
          </div>
        `).join("")}
      </div>
      <div class="mt-5 flex justify-end gap-2">
        <button id="cancelBtn" class="rounded-lg border border-zinc-200 bg-white px-4 py-2 text-sm font-medium text-zinc-700 hover:bg-zinc-50">Annuler</button>
        <button id="saveBtn" class="rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 px-4 py-2 text-sm font-medium text-white">Enregistrer</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector("#closeModalBtn").onclick = close;
  wrap.querySelector("#cancelBtn").onclick = close;
  wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
  wrap.querySelector("#saveBtn").onclick = () => {
    const row = { _id: "row_" + Math.random().toString(36).slice(2,9) };
    wrap.querySelectorAll("[data-col]").forEach((el) => { row[el.dataset.col] = el.value; });
    table.rows.push(row);
    saveSchema(schema);
    close();
    alert("Ligne ajoutée.");
  };
}

function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
function escapeAttr(s) { return escapeHtml(s); }

const PAGE_SIZE = 100;
let page = 0;
let search = "";
const selectorValues = {};

function renderTable(table, cfg) {
  const ownCols = cfg.visibleColumns.map((id) => table.columns.find((c) => c.id === id)).filter(Boolean).map((c) => ({ kind: "own", id: c.id, name: c.name, type: c.type, ref: c }));
  const joinCols = (cfg.joinedColumns || []).map((jc) => {
    const rel = schema.relations.find((r) => r.id === jc.viaRelation);
    const other = rel ? otherSideOfRelation(rel, table.id, schema) : { table: null };
    const col = other.table?.columns.find((c) => c.id === jc.column);
    return { kind: "join", id: jc.id, name: col ? `${other.table.name}.${col.name}` : "?", type: col?.type || "texte", jc };
  });
  const allCols = [...ownCols, ...joinCols];

  if (allCols.length === 0) {
    document.getElementById("content").innerHTML = `<p class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">Aucune colonne visible. Sélectionnez-en dans <a class="font-medium underline" href="admin.html#modules">la configuration</a>.</p>`;
    return;
  }

  // Filtre implicite par unité courante (auto-détection si non configuré)
  const unit = getCurrentUnit();
  let unitColId = cfg.unitColumn;
  if (!unitColId && unit) {
    const auto = table.columns.find((c) => /^(unit[ée]|u|unit)$/i.test(c.name.trim()));
    if (auto) unitColId = auto.id;
  }
  let preRows = table.rows;
  if (unitColId && unit) {
    const target = String(unit).trim().toLowerCase();
    preRows = preRows.filter((r) => String(r[unitColId] ?? "").trim().toLowerCase() === target);
  }
  const baseRows = applyFilters(preRows, cfg.filters, table.columns);

  const selectorDefs = (cfg.selectors || []).map((s) => ({ ...s, col: table.columns.find((c) => c.id === s.column) })).filter((s) => s.col);

  const selectors = selectorDefs.map((s) => {
    const others = selectorDefs.filter((o) => o.id !== s.id);
    const scoped = baseRows.filter((r) => others.every((o) => {
      const want = selectorValues[o.id];
      return want === undefined || want === "" || String(r[o.col.id] ?? "") === String(want);
    }));
    const map = new Map();
    for (const r of scoped) {
      const v = r[s.col.id];
      if (v === undefined || v === null || v === "") continue;
      const k = String(v);
      map.set(k, (map.get(k) || 0) + 1);
    }
    const distinct = [...map.entries()].sort((a, b) => a[0].localeCompare(b[0], "fr", { numeric: true }));
    return { id: s.id, col: s.col, distinct, totalCount: scoped.length };
  });

  // KPIs du module
  const moduleKpis = (cfg.kpis || []).map((id) => (schema.kpis || []).find((k) => k.id === id)).filter(Boolean);
  const kpisHtml = moduleKpis.length === 0 ? "" : `
    <div class="mb-4 grid gap-3 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
      ${moduleKpis.map((k) => {
        const c = (KPI_COLORS.find((x) => x.v === (k.color || "indigo")) || KPI_COLORS[0]);
        const r = computeKpi(k, schema);
        return `<div class="rounded-2xl border ${c.border} ${c.bg} p-4">
          <p class="text-xs font-medium uppercase tracking-wide ${c.text}">${escapeHtml(k.name)}</p>
          <p class="mt-1 text-3xl font-bold ${c.text}">${r.valid ? r.value : "—"}</p>
        </div>`;
      }).join("")}
    </div>
  `;

  const content = document.getElementById("content");
  content.innerHTML = `
    ${kpisHtml}
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">${escapeHtml(mod.label)}</h1>
        <p id="metaLine" class="text-sm text-zinc-500"></p>
      </div>
      <div class="flex items-center gap-2">
        <input id="search" placeholder="Rechercher…" class="rounded-lg border border-zinc-300 px-3 py-2 text-sm" />
        <button id="addRow" class="rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 px-4 py-2 text-sm font-medium text-white">+ Nouvelle ligne</button>
      </div>
    </div>

    ${selectors.length > 0 ? `
    <div class="mb-4 flex flex-wrap items-center gap-3 rounded-2xl border border-zinc-200 bg-white px-4 py-3 shadow-sm">
      <span class="text-xs font-semibold uppercase tracking-wide text-zinc-500">Filtres</span>
      ${selectors.map((s) => `
        <label class="flex items-center gap-2 text-sm">
          <span class="text-zinc-600">${escapeHtml(s.col.name)} :</span>
          <select data-selid="${s.id}" class="rounded border border-zinc-300 bg-white px-2 py-1 text-sm">
            <option value="">— tous (${s.totalCount}) —</option>
            ${s.distinct.map(([v, count]) => `<option value="${escapeAttr(v)}" ${selectorValues[s.id]===v?'selected':''}>${escapeHtml(v)} (${count})</option>`).join("")}
          </select>
        </label>
      `).join("")}
      ${Object.keys(selectorValues).length > 0 ? `<button id="resetSelectors" class="ml-auto text-xs font-medium text-indigo-600 hover:text-indigo-700">Réinitialiser</button>` : ""}
    </div>` : ""}

    <div class="overflow-auto rounded-2xl border border-zinc-200 bg-white shadow-sm" style="max-height: calc(100vh - 260px)">
      <table class="w-full text-sm table-fixed">
        <colgroup>${allCols.map(() => `<col />`).join("")}</colgroup>
        <thead class="sticky top-0 z-[5] bg-zinc-50 shadow-[0_1px_0_0_#e4e4e7]">
          <tr>${allCols.map((c) => `<th title="${escapeAttr(c.name)}" class="px-4 py-3 text-left font-semibold ${c.kind==='join'?'text-indigo-700':'text-zinc-700'}"><div class="truncate">${escapeHtml(c.name)}</div><span class="text-xs font-normal ${c.kind==='join'?'text-indigo-400':'text-zinc-400'}">${c.kind==='join'?'lié · '+c.type:c.type}</span></th>`).join("")}</tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="pager" class="mt-3 flex items-center justify-between text-xs text-zinc-600"></div>
  `;

  document.getElementById("search").addEventListener("input", (e) => {
    search = e.target.value.toLowerCase();
    page = 0;
    paint();
  });
  content.querySelectorAll("[data-selid]").forEach((el) => el.addEventListener("change", () => {
    const v = el.value;
    if (v === "") delete selectorValues[el.dataset.selid];
    else selectorValues[el.dataset.selid] = v;
    page = 0; renderTable(table, cfg);
  }));
  const reset = document.getElementById("resetSelectors");
  if (reset) reset.addEventListener("click", () => {
    for (const k in selectorValues) delete selectorValues[k];
    renderTable(table, cfg);
  });

  function paint() {
    const tb = document.getElementById("rows");
    const pager = document.getElementById("pager");
    const meta = document.getElementById("metaLine");
    let filtered = applyFilters(table.rows, cfg.filters, table.columns);
    // Sélecteurs dynamiques
    for (const s of selectors) {
      const want = selectorValues[s.id];
      if (want !== undefined && want !== "") {
        filtered = filtered.filter((row) => String(row[s.col.id] ?? "") === String(want));
      }
    }
    if (search) {
      filtered = filtered.filter((row) => allCols.some((c) => {
        const val = c.kind === "own" ? row[c.id] : getJoinedValue(row, table, c.jc, schema);
        return String(val ?? "").toLowerCase().includes(search);
      }));
    }
    meta.innerHTML = `<span class="inline-flex items-center gap-1 rounded-full bg-indigo-50 px-2.5 py-0.5 font-medium text-indigo-700">${filtered.length}</span> / ${baseRows.length} ligne(s) · ${allCols.length} colonne(s)`;

    if (filtered.length === 0) {
      tb.innerHTML = `<tr><td colspan="${allCols.length}" class="px-4 py-6 text-center text-sm text-zinc-500">Aucune ligne.</td></tr>`;
      pager.innerHTML = "";
      return;
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (page >= totalPages) page = totalPages - 1;
    const start = page * PAGE_SIZE;
    const pageRows = filtered.slice(start, start + PAGE_SIZE);

    tb.innerHTML = pageRows.map((row) => `
      <tr class="border-t border-zinc-100">
        ${allCols.map((c) => {
          if (c.kind === "join") {
            const val = getJoinedValue(row, table, c.jc, schema);
            return `<td title="${escapeAttr(val)}" class="px-4 py-2 text-indigo-700 truncate bg-indigo-50/30">${escapeHtml(val)}</td>`;
          }
          const editable = cfg.editableColumns.includes(c.id);
          const val = row[c.id] ?? "";
          if (editable) {
            if (c.type === "liste") {
              const opts = c.ref?.options || [];
              return `<td class="px-3 py-1 overflow-hidden"><select data-row="${row._id}" data-col="${c.id}" class="w-full rounded border border-transparent bg-transparent px-2 py-1 hover:border-zinc-200 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500/20 outline-none"><option value="">—</option>${opts.map((o) => `<option ${String(val)===o?'selected':''}>${escapeHtml(o)}</option>`).join("")}</select></td>`;
            }
            return `<td class="px-3 py-1 overflow-hidden"><input title="${escapeAttr(val)}" data-row="${row._id}" data-col="${c.id}" type="${c.type==='nombre'?'number':c.type==='date'?'date':'text'}" value="${escapeAttr(val)}" class="w-full rounded border border-transparent bg-transparent px-2 py-1 hover:border-zinc-200 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500/20 outline-none" /></td>`;
          }
          return `<td title="${escapeAttr(val)}" class="px-4 py-2 text-zinc-800 truncate">${escapeHtml(val)}</td>`;
        }).join("")}
      </tr>
    `).join("");
    tb.querySelectorAll("input,select").forEach((el) => el.addEventListener("change", () => {
      const r = table.rows.find((r) => r._id === el.dataset.row);
      if (r) { r[el.dataset.col] = el.value; saveSchema(schema); }
    }));

    pager.innerHTML = `
      <span>Page ${page+1} / ${totalPages} · lignes ${start+1}–${Math.min(start+PAGE_SIZE, filtered.length)}</span>
      <div class="flex gap-2">
        <button id="pgPrev" class="rounded border border-zinc-200 bg-white px-2 py-1 ${page===0?'opacity-40 cursor-not-allowed':''}">‹ Précédent</button>
        <button id="pgNext" class="rounded border border-zinc-200 bg-white px-2 py-1 ${page>=totalPages-1?'opacity-40 cursor-not-allowed':''}">Suivant ›</button>
      </div>`;
    document.getElementById("pgPrev").onclick = () => { if (page>0){ page--; paint(); } };
    document.getElementById("pgNext").onclick = () => { if (page<totalPages-1){ page++; paint(); } };
  }
  paint();

  document.getElementById("addRow").addEventListener("click", () => {
    const newRow = { _id: "row_" + Math.random().toString(36).slice(2,9) };
    table.columns.forEach((c) => (newRow[c.id] = ""));
    table.rows.push(newRow); saveSchema(schema); paint();
  });
}
</script>
</body>
</html>
