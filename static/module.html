<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>APP-GAP — Module</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50">

<header class="sticky top-0 z-10 border-b border-zinc-200 bg-white/80 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-3">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 shadow-sm">
        <span class="text-base font-bold text-white">G</span>
      </a>
      <div>
        <p id="modTitle" class="text-sm font-semibold text-zinc-900">—</p>
        <p id="modSub" class="text-xs text-zinc-500">—</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a id="cfgLink" href="#" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50">Configurer</a>
      <a href="dashboard.html" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50">Retour</a>
    </div>
  </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-6">
  <div id="content"></div>
</main>

<script src="app-data.js"></script>
<script>
try { if (sessionStorage.getItem("session") !== "admin") window.location.href = "login.html"; } catch {}

const params = new URLSearchParams(location.search);
const moduleId = params.get("id");
const mod = MODULES.find((m) => m.id === moduleId);
const schema = loadSchema();

document.getElementById("cfgLink").href = `admin.html#modules`;

if (!mod) {
  document.getElementById("content").innerHTML = `<p class="text-sm text-zinc-500">Module introuvable.</p>`;
} else {
  document.getElementById("modTitle").textContent = mod.label;
  const cfg = schema.moduleConfigs[mod.id];
  const table = cfg?.tableId ? schema.tables[cfg.tableId] : null;
  document.getElementById("modSub").textContent = table ? `Source : ${table.name}` : "Non configuré";

  const content = document.getElementById("content");
  if (!cfg || !cfg.tableId || !table) {
    content.innerHTML = `
      <div class="rounded-2xl border border-dashed border-zinc-300 bg-white p-10 text-center">
        <p class="text-sm text-zinc-600">Aucune table n'est associée à ce module.</p>
        <a href="admin.html#modules" class="mt-3 inline-block rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 px-4 py-2 text-sm font-medium text-white">Configurer le module</a>
      </div>`;
  } else {
    renderTable(table, cfg);
  }
}

function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
function escapeAttr(s) { return escapeHtml(s); }

function renderTable(table, cfg) {
  const visibleCols = cfg.visibleColumns.map((id) => table.columns.find((c) => c.id === id)).filter(Boolean);
  if (visibleCols.length === 0) {
    document.getElementById("content").innerHTML = `<p class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">Aucune colonne visible. Sélectionnez-en dans <a class="font-medium underline" href="admin.html#modules">la configuration</a>.</p>`;
    return;
  }
  const rows = applyFilters(table.rows, cfg.filters, table.columns);

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="mb-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">${escapeHtml(mod.label)}</h1>
        <p class="text-sm text-zinc-500">${rows.length} ligne(s) · ${visibleCols.length} colonne(s)</p>
      </div>
      <button id="addRow" class="rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 px-4 py-2 text-sm font-medium text-white">+ Nouvelle ligne</button>
    </div>
    <div class="overflow-x-auto rounded-2xl border border-zinc-200 bg-white shadow-sm">
      <table class="min-w-full text-sm">
        <thead class="bg-zinc-50">
          <tr>${visibleCols.map((c) => `<th class="px-4 py-3 text-left font-semibold text-zinc-700">${escapeHtml(c.name)}<span class="ml-1 text-xs font-normal text-zinc-400">${c.type}</span></th>`).join("")}</tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  `;

  function paint() {
    const tb = document.getElementById("rows");
    const filtered = applyFilters(table.rows, cfg.filters, table.columns);
    if (filtered.length === 0) {
      tb.innerHTML = `<tr><td colspan="${visibleCols.length}" class="px-4 py-6 text-center text-sm text-zinc-500">Aucune ligne.</td></tr>`;
      return;
    }
    tb.innerHTML = filtered.map((row) => `
      <tr class="border-t border-zinc-100">
        ${visibleCols.map((c) => {
          const editable = cfg.editableColumns.includes(c.id);
          const val = row[c.id] ?? "";
          if (editable) {
            return `<td class="px-3 py-1"><input data-row="${row._id}" data-col="${c.id}" type="${c.type==='nombre'?'number':c.type==='date'?'date':'text'}" value="${escapeAttr(val)}" class="w-full rounded border border-transparent bg-transparent px-2 py-1 hover:border-zinc-200 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500/20 outline-none" /></td>`;
          }
          return `<td class="px-4 py-2 text-zinc-800">${escapeHtml(val)}</td>`;
        }).join("")}
      </tr>
    `).join("");
    tb.querySelectorAll("input").forEach((el) => el.addEventListener("change", () => {
      const r = table.rows.find((r) => r._id === el.dataset.row);
      if (r) { r[el.dataset.col] = el.value; saveSchema(schema); }
    }));
  }
  paint();

  document.getElementById("addRow").addEventListener("click", () => {
    const newRow = { _id: "row_" + Math.random().toString(36).slice(2,9) };
    table.columns.forEach((c) => (newRow[c.id] = ""));
    table.rows.push(newRow); saveSchema(schema); paint();
  });
}
</script>
</body>
</html>
