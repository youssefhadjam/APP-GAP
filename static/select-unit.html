<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>APP-GAP — Choix de l'unité</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<style>body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100">

<header class="border-b border-zinc-200 bg-white/80 backdrop-blur">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-3">
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 shadow-sm">
        <span class="text-base font-bold text-white">G</span>
      </div>
      <div>
        <p class="text-sm font-semibold text-zinc-900">APP-GAP</p>
        <p class="text-xs text-zinc-500">Choix de l'unité</p>
      </div>
    </div>
    <button id="logout" class="rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 hover:bg-zinc-50">Déconnexion</button>
  </div>
</header>

<main class="mx-auto max-w-5xl px-6 py-12">
  <div class="mb-8 text-center">
    <h1 class="text-3xl font-semibold tracking-tight text-zinc-900">Sélectionnez une unité</h1>
    <p class="mt-2 text-sm text-zinc-500">Les données affichées seront filtrées en fonction de l'unité choisie.</p>
  </div>

  <div id="empty" class="hidden rounded-2xl border border-dashed border-zinc-300 bg-white p-10 text-center shadow-sm">
    <p class="text-sm text-zinc-600">Aucune unité n'a été configurée.</p>
    <a href="admin.html#units" class="mt-3 inline-block rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 px-4 py-2 text-sm font-medium text-white">Configurer dans l'administration</a>
  </div>

  <div id="grid" class="grid gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6"></div>
</main>

<script>
try { if (sessionStorage.getItem("session") !== "admin") window.location.href = "login.html"; } catch {}

document.getElementById("logout").addEventListener("click", () => {
  try { sessionStorage.removeItem("session"); sessionStorage.removeItem("currentUnit"); } catch {}
  window.location.href = "login.html";
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app-data.js"></script>
<script>
(async () => {
  const schema = await loadSchema();
  const units = schema.units || [];
  const grid = document.getElementById("grid");
  if (units.length === 0) {
    document.getElementById("empty").classList.remove("hidden");
    return;
  }
  grid.innerHTML = units.map((u) => `
    <button data-u="${encodeURIComponent(u)}" class="unitBtn group flex items-center justify-center rounded-2xl border border-zinc-200 bg-white px-4 py-6 text-center font-semibold text-zinc-800 shadow-sm transition hover:-translate-y-0.5 hover:border-indigo-300 hover:text-indigo-700 hover:shadow-md">
      ${u}
    </button>
  `).join("");
  grid.querySelectorAll(".unitBtn").forEach((b) => b.addEventListener("click", () => {
    setCurrentUnit(decodeURIComponent(b.dataset.u));
    window.location.href = "dashboard.html";
  }));
})();
</script>
</body>
</html>
