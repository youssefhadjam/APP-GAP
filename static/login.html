<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>APP-GAP — Connexion</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-white to-slate-100 px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 shadow-lg shadow-indigo-500/30">
        <span class="text-2xl font-bold text-white">G</span>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">Bienvenue sur APP-GAP</h1>
      <p class="mt-1 text-sm text-zinc-500">Connectez-vous pour accéder à vos outils</p>
    </div>

    <div class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm">
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-zinc-700">Identifiant</label>
          <input id="email" type="text" required placeholder="admin"
            class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
        </div>
        <div>
          <div class="mb-1.5 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-zinc-700">Mot de passe</label>
            <a href="#" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">Oublié ?</a>
          </div>
          <div class="relative">
            <input id="password" type="password" required placeholder="••••••••"
              class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 pr-10 text-sm text-zinc-900 placeholder-zinc-400 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
            <button type="button" id="togglePwd" aria-label="Afficher/Masquer"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-zinc-500 hover:text-zinc-700">
              <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeOff" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2 text-sm text-zinc-700">
          <input id="remember" type="checkbox" class="h-4 w-4 rounded border-zinc-300 text-indigo-600 focus:ring-indigo-500" />
          Se souvenir de moi
        </label>

        <div id="error" class="hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"></div>

        <button type="submit"
          class="w-full rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm shadow-indigo-500/30 transition hover:from-indigo-600 hover:to-violet-700">
          Se connecter
        </button>

        <p class="rounded-lg bg-zinc-50 px-3 py-2 text-center text-xs text-zinc-500">
          Compte de test : <span class="font-mono font-medium text-zinc-700">admin</span> / <span class="font-mono font-medium text-zinc-700">admin</span>
        </p>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-zinc-500">© <span id="year"></span> APP-GAP. Tous droits réservés.</p>
  </div>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const pwd = document.getElementById("password");
  const eyeOpen = document.getElementById("eyeOpen");
  const eyeOff = document.getElementById("eyeOff");
  document.getElementById("togglePwd").addEventListener("click", () => {
    const isHidden = pwd.type === "password";
    pwd.type = isHidden ? "text" : "password";
    eyeOpen.classList.toggle("hidden", isHidden);
    eyeOff.classList.toggle("hidden", !isHidden);
  });

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = pwd.value;
    const err = document.getElementById("error");
    if (email === "admin" && password === "admin") {
      try { sessionStorage.setItem("session", "admin"); } catch {}
      window.location.href = "dashboard.html";
    } else {
      err.textContent = "Identifiants invalides";
      err.classList.remove("hidden");
    }
  });
</script>
</body>
</html>
